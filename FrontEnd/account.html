<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - CritCache</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        background-color: #d3d3d3;
        text-align: center;
    }

    /* HEADER (same as your other pages) */
    .header {
        background: linear-gradient(to right, #1e5fd4, #1fd4c7);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    .logo {
        font-size: 36px;
        font-weight: 700;
        text-decoration: none;
        color: white;
    }

    .nav {
        display: flex;
        gap: 25px;
    }

    .nav a {
        text-decoration: none;
        color: white;
        font-size: 14px;
    }

    /* TITLE */
    .title {
        margin-top: 80px;
        font-size: 40px;
        text-shadow: 2px 2px 0px #000;
    }

    .subtitle {
        margin-top: 20px;
        font-size: 22px;
        color: red;
        text-shadow: 2px 2px 0px red;
    }

    /* BUTTON CONTAINER */
    .button-container {
        margin-top: 100px;
        display: flex;
        justify-content: center;
        gap: 60px;
    }

    /* BUTTON STYLE */
    .account-btn {
        width: 220px;
        height: 120px;
        border: 2px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        text-decoration: none;
        font-family: 'Orbitron', sans-serif;

        /* same style you've been using */
        background-color: white;
        color: black;

        transition: 0.2s;
    }

    .account-btn:hover {
        background-color: #e0e0e0;
        transform: scale(1.05);
    }
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
    <a href="/FrontEnd/frontend/src/index.html" class="logo">CRITCACHE</a>
    <div class="nav">
        <a href="/FrontEnd/account.html">ACCT</a>
        <a href="/FrontEnd/retro.html">RETRO GAMING</a>
        <a href="/FrontEnd/40k.html">40K</a>
        <a href="/FrontEnd/dnd.html">DND</a>
        <a href="/FrontEnd/cards.html">CARD GAMES</a>
        <a href="/FrontEnd/figures.html">ACTION FIGURES</a>
        <a href="/FrontEnd/frontend/src/app/cart/cart.html">CART</a>
        <a href="/FrontEnd/frontend/src/app/wishlist/wishlist.html">WISHLIST</a>
        <a href="/FrontEnd/frontend/src/app/price-check/price-check.html">Card PRICE CHECK</a>
        <a href="/FrontEnd/frontend/src/app/deck-builder/deck-builder.html">DECK BUIDLER</a>
    </div>
</div>

<!-- CONTENT -->
<div class="title">ACCOUNT ACCESS</div>
<div class="subtitle">CHOOSE AN OPTION</div>

<div class="button-container">
    <a href="LoginPage.html" class="account-btn">LOG IN</a>
    <a href="RegisterPage.html" class="account-btn">REGISTER</a>
</div>

</body>
</html>
