<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - CritCache</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        background-color: #d3d3d3;
    }

    /* HEADER (same as index) */
    .header {
        background: linear-gradient(to right, #1e5fd4, #1fd4c7);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    .logo {
        font-size: 36px;
        font-weight: 700;
        text-decoration: none;
        color: white;
    }

    .nav {
        display: flex;
        gap: 25px;
    }

    .nav a {
        text-decoration: none;
        color: white;
        font-size: 14px;
    }

    /* PAGE TITLE */
    .page-title {
        text-align: center;
        margin-top: 40px;
        font-size: 36px;
        text-shadow: 2px 2px 0px #000;
    }

    /* GRID */
    .products {
        margin: 50px auto;
        width: 90%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 40px;
    }

    /* PRODUCT BOX */
    .product-card {
        border: 2px solid #888;
        padding: 15px;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.2s;
    }

    .product-card:hover {
        transform: scale(1.03);
        background-color: #e0e0e0;
    }

    /* IMAGE PLACEHOLDER */
    .product-image {
    width: 100%;
    height: 150px; /* fixed box size */
    overflow: hidden; /* prevents spill */
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* image fills box */
    display: block;
}

    /* TEXT */
    .product-name {
        font-size: 18px;
        margin-bottom: 10px;
        text-align: center;
    }

    .product-price {
        font-size: 16px;
        margin-bottom: 15px;
    }

    /* BUTTON */
    .buy-btn {
        padding: 10px 20px;
        border: 2px solid black;
        background-color: white;
        color: black;
        cursor: pointer;
        font-family: 'Orbitron', sans-serif;
    }

    .buy-btn:hover {
        background-color: #ddd;
    }
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
    <a href="index.html" class="logo">CRITCACHE</a>
    <div class="nav">
        <a href="account.html">ACCT</a>
        <a href="retro.html">RETRO GAMING</a>
        <a href="40k.html">40K</a>
        <a href="dnd.html">DND</a>
        <a href="cards.html">CARD GAMES</a>
        <a href="figures.html">ACTION FIGURES</a>
    </div>
</div>

<!-- TITLE -->
<div class="page-title">Transformers Action Figures</div>

<!-- PRODUCT GRID -->
<div class="products">

<!-- ITEM 1 -->
    <div class="product-card">
        <div class="product-image"><img src="/Images/LSWDS.jpg"></div>
        <div class="product-name">Lego Star Wars: The Complete Saga DS</div>
        <div class="product-price">$19.99</div>
        <button class="buy-btn">BUY</button>
    </div>

    <!-- ITEM 2 -->
    <div class="product-card">
         <div class="product-image"><img src="/Images/WSR.jpg"></div>
        <div class="product-name">Wii Sports Resort</div>
        <div class="product-price">$39.99</div>
        <button class="buy-btn">BUY</button>
    </div>

    <!-- ITEM 3 -->
    <div class="product-card">
        <div class="product-image"><img src="/Images/CODG.jpg"></div>
        <div class="product-name">Call of Duty Ghosts</div>
        <div class="product-price">$9.99</div>
        <button class="buy-btn">BUY</button>
    </div>

</div>

</body>
</html>
